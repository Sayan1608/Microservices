server:
  port: 8084

spring:
 application:
  name: API-GATEWAY

 cloud:
   gateway:
     routes:
       - id: USER-SERVICE
         uri: lb://USERSERVICE
         predicates:
           - Path=/users/**
       - id: HOTEL-SERVICE
         uri: lb://HOTELSERVICE
         predicates:
           - Path=/hotels/**,/staffs/**
       - id: RATING-SERVICE
         uri: lb://RATINGSERVICE
         predicates:
           - Path=/ratings/**


eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

